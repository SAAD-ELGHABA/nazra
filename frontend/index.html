  <!--
    Google Consent Mode v2 defaults. This must be the first script on the page:
    the defaults have to be in the dataLayer before any measurement tag loads,
    otherwise that tag starts out with implicit permission.

    Everything optional starts denied. A previously stored decision is read
    synchronously and re-applied here so a returning visitor who consented is
    not held at "denied" until React has mounted. Kept in plain ES5 with no
    dependency on the bundle, and mirrors src/utils/consent.js.
  -->
  <script>
    (function () {
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;

      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted'
      });

      try {
        var stored = JSON.parse(localStorage.getItem('nazra_consent'));
        // Keep this version in step with CONSENT_VERSION in src/utils/consent.js.
        if (stored && stored.version === 1 && stored.categories) {
          gtag('consent', 'update', {
            ad_storage: stored.categories.marketing ? 'granted' : 'denied',
            ad_user_data: stored.categories.marketing ? 'granted' : 'denied',
            ad_personalization: stored.categories.marketing ? 'granted' : 'denied',
            analytics_storage: stored.categories.analytics ? 'granted' : 'denied'
          });
        }
      } catch (error) {
        /* No stored decision, or storage unavailable: stay denied. */
      }
    })();
  </script>
